modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Must construct after Immersive Melodies so its item map exists, and before its RegisterEvent fires
[[dependencies.${mod_id}]]
modId = "immersive_melodies"
type = "required"
versionRange = "${immersive_melodies_version_range}"
ordering = "AFTER"
side = "BOTH"
